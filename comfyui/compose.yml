# ComfyUI on the home GPU (ADR-0004 as amended 2026-10-05). Dev use today —
# the GUI at http://127.0.0.1:8188 for style work (roadmap item 3c); the same
# image runs headless for the worker later (item 4).
#
#   docker compose -f comfyui/compose.yml build
#   docker compose -f comfyui/compose.yml run --rm comfyui python /home/comfy/smoke.py
#   docker compose -f comfyui/compose.yml run --rm comfyui python /home/comfy/models.py fetch
#   docker compose -f comfyui/compose.yml up
#
# Models, inputs and outputs live under var/comfyui/ (gitignored) or wherever
# COMFYUI_DATA points — on the prod box, its own distro's disk. `up` fills the
# models store from models.manifest and verifies every file before serving.
services:
  comfyui:
    build:
      context: .
      args:
        TORCH: ${TORCH:-xpu}
    image: monster-paws-comfyui:dev
    # WSL2: the GPU is /dev/dxg and the Windows driver mirror is /usr/lib/wsl.
    # Both `lib` and `drivers` are needed — mounting only `lib` finds no GPU.
    devices:
      - /dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ${COMFYUI_DATA:-../var/comfyui}/models:/home/comfy/ComfyUI/models
      - ${COMFYUI_DATA:-../var/comfyui}/input:/home/comfy/ComfyUI/input
      - ${COMFYUI_DATA:-../var/comfyui}/output:/home/comfy/ComfyUI/output
      - ${COMFYUI_DATA:-../var/comfyui}/user:/home/comfy/ComfyUI/user
    ports:
      - "127.0.0.1:8188:8188"
    # Sysman (zes) is unavailable under WSL2; the warning it prints is benign.
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      COMFY_ARGS: ${COMFY_ARGS:-}
    # gpu.env is written by comfyui/guard.sh from GPU_ENV for one start
    # (driver debug keys, MONSTERPAWS_KEEP_XPU_CACHE); empty otherwise.
    env_file:
      - ./gpu.env
    shm_size: 2g
    # Never raise the open-files limit and never auto-restart: the IP-Adapter
    # path leaks ~1.5 GB of HOST memory per image through /dev/dxg, and the
    # engine's 1024-descriptor default is the only thing that stops it before
    # Windows freezes (it did, twice, 2026-10-07 — doc/infra.md, Home GPU).
    restart: "no"

  # The look's sampling harness (doc/plans/the-look-exploration.md): same
  # image, no GPU, talks to the comfyui service over the compose network.
  #   npm run explore -- run batch1
  explore:
    image: monster-paws-comfyui:dev
    profiles: ["explore"]
    entrypoint: ["python", "/home/comfy/harness/explore.py"]
    # the CPU-side encoder load for the likeness scorer stalled the whole WSL VM
    # three times on 2026-10-10 (doc/issues.md, Ops): bounded here, never unbounded
    mem_limit: 12g
    environment:
      OMP_NUM_THREADS: "4"
      DETECT_OUT: ${DETECT_OUT:-/home/comfy/explore/detect}
      DETECT_SPEC: ${DETECT_SPEC:-detect.json}
      DETECT_PIPELINES: ${DETECT_PIPELINES:-owlv2}
    volumes:
      - ./:/home/comfy/harness:ro
      - ../var/crew:/home/comfy/crew:ro
      - ../var/photos:/home/comfy/photos:ro
      - ../var/explore:/home/comfy/explore
      - ${COMFYUI_DATA:-../var/comfyui}/input:/home/comfy/ComfyUI/input
      - ${COMFYUI_DATA:-../var/comfyui}/output:/home/comfy/ComfyUI/output:ro
      - ${COMFYUI_DATA:-../var/comfyui}/models:/home/comfy/ComfyUI/models:ro
