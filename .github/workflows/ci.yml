name: CI

on:
  push:
    branches: [main, topdog]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ship bar: green twice (flaky bar from /shipshape)
      - run: npm test
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # e2e against the PRODUCTION build — dev-mode green does not count
      - name: e2e vs production server
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && break
            sleep 1
          done
          npm run e2e:prod

  images:
    # Build + push production images after verification (ADR-0007 amended:
    # droplet pulls from GHCR; no on-droplet builds — 1GB box can't).
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/topdog'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push app image
        run: |
          docker build --target app --build-arg BUILD_SHA=${{ github.sha }} \
            -t ghcr.io/loganbresnahan/monster-paws-app:latest \
            -t ghcr.io/loganbresnahan/monster-paws-app:${{ github.sha }} .
          docker push --all-tags ghcr.io/loganbresnahan/monster-paws-app
      - name: Build and push worker image
        run: |
          docker build --target worker \
            -t ghcr.io/loganbresnahan/monster-paws-worker:latest \
            -t ghcr.io/loganbresnahan/monster-paws-worker:${{ github.sha }} .
          docker push --all-tags ghcr.io/loganbresnahan/monster-paws-worker
