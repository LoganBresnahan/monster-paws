name: CI

on:
  push:
    branches: [main, topdog]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Never set SKIP_DB_TESTS to go green — CI provisions Postgres or the
      # run fails (ADR-0017 as amended). Image and credentials are
      # docker-compose.dev.yml's, so the suite's default TEST_DATABASE_URL
      # resolves here with no env at all; change them in both files or neither.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: monsterpaws
          POSTGRES_PASSWORD: monsterpaws
          POSTGRES_DB: monsterpaws
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monsterpaws"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ship bar: green twice (flaky bar from /shipshape)
      - run: npm test
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # e2e against the PRODUCTION build — dev-mode green does not count. The
      # script builds; Playwright starts the standalone server on the seeded
      # monsterpaws_e2e in this job's Postgres service (ADR-0017 as amended).
      - run: npm run e2e

  images:
    # Build + push production images after verification (ADR-0007 amended:
    # droplet pulls from GHCR; no on-droplet builds — 1GB box can't).
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/topdog'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push app image
        run: |
          docker build --target app --build-arg BUILD_SHA=${{ github.sha }} \
            -t ghcr.io/loganbresnahan/monster-paws-app:latest \
            -t ghcr.io/loganbresnahan/monster-paws-app:${{ github.sha }} .
          docker push --all-tags ghcr.io/loganbresnahan/monster-paws-app
      - name: Build and push worker image
        run: |
          docker build --target worker \
            -t ghcr.io/loganbresnahan/monster-paws-worker:latest \
            -t ghcr.io/loganbresnahan/monster-paws-worker:${{ github.sha }} .
          docker push --all-tags ghcr.io/loganbresnahan/monster-paws-worker
