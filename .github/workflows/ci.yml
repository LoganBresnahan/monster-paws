name: CI

on:
  push:
    branches: [main, topdog]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ship bar: green twice (flaky bar from /shipshape)
      - run: npm test
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # e2e against the PRODUCTION build — dev-mode green does not count
      - name: e2e vs production server
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && break
            sleep 1
          done
          npm run e2e:prod
