name: CI

on:
  push:
    branches: [main, topdog, 'hotfix/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Never set SKIP_DB_TESTS to go green — CI provisions Postgres or the
      # run fails (ADR-0017 as amended). Image and credentials are
      # docker-compose.dev.yml's, so the suite's default TEST_DATABASE_URL
      # resolves here with no env at all; change them in both files or neither.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: monsterpaws
          POSTGRES_PASSWORD: monsterpaws
          POSTGRES_DB: monsterpaws
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monsterpaws"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ship bar: green twice (flaky bar from /shipshape)
      - run: npm test
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # e2e against the PRODUCTION build — dev-mode green does not count. The
      # script builds; Playwright starts the standalone server on the seeded
      # monsterpaws_e2e in this job's Postgres service (ADR-0017 as amended).
      - run: npm run e2e

  images:
    # Build + push production images after verification (ADR-0007 amended:
    # droplet pulls from GHCR; no on-droplet builds — 1GB box can't).
    # Sha tags only, never :latest — production pins IMAGE_TAG, and a moving
    # :latest is how a routine pull deploys whatever CI built last (oplog 0002).
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/topdog' || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP: ghcr.io/loganbresnahan/monster-paws-app:${{ github.sha }}
      WORKER: ghcr.io/loganbresnahan/monster-paws-worker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push app image
        run: |
          docker build --target app --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.BETTERSTACK_ERRORS_DSN }} -t "$APP" .
          docker push "$APP"
      # Same build, same cache: the maps carry the debug IDs stamped into the
      # image just pushed — never a second `next build`, whose IDs could differ.
      - name: Export source maps from the same build
        run: |
          docker build --target sourcemaps --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.BETTERSTACK_ERRORS_DSN }} \
            --output type=local,dest=sourcemaps .
      - uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ github.sha }}
          path: sourcemaps
          retention-days: 7
      - name: Build and push worker image
        run: |
          docker build --target worker --build-arg BUILD_SHA=${{ github.sha }} -t "$WORKER" .
          docker push "$WORKER"

  sourcemaps:
    # The error service processes uploads slowly and on its own schedule, so
    # it runs here — never inside a build. /deploy requires this job green for
    # the sha it rolls: errors that arrive before processing stay minified
    # forever (ADR-0010 as amended 2026-09-30).
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: sourcemaps-${{ github.sha }}
          path: sourcemaps
      - name: Upload and wait for processing
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.BETTERSTACK_SOURCEMAPS_TOKEN }}
          SENTRY_URL: ${{ vars.BETTERSTACK_SOURCEMAPS_URL }}
          SENTRY_ORG: ${{ vars.BETTERSTACK_TEAM_ID }}
          SENTRY_PROJECT: ${{ vars.BETTERSTACK_ERRORS_APP_ID }}
          BUILD_SHA: ${{ github.sha }}
        run: sh scripts/sourcemaps.sh upload sourcemaps
