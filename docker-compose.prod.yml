# Production stack on the droplet (ADR-0007, amended): Caddy → app; worker
# alongside. Images are BUILT IN CI and pulled from GHCR — the $6 droplet
# doesn't build. Postgres is DO Managed (ADR-0003) — external DATABASE_URL.
# Deploy: set IMAGE_TAG=<sha> in .env, then git pull &&
#         docker compose -f docker-compose.prod.yml pull && ... up -d
#         (/deploy; the sha's `sourcemaps` CI job must be green first).
# (build: targets remain for local e2e:prod use — CI and local pass --build.)
# Log rotation (ADR-0010): stdout JSON captured by docker, bounded on disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    <<: *logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    # Pinned by IMAGE_TAG in .env, never :latest — every topdog push moves
    # :latest, so an implicit tag deploys whatever CI built last (oplog 0002).
    image: ghcr.io/loganbresnahan/monster-paws-app:${IMAGE_TAG:?set IMAGE_TAG in .env}
    build:
      context: .
      target: app
    <<: *logging
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  worker:
    image: ghcr.io/loganbresnahan/monster-paws-worker:${IMAGE_TAG:?set IMAGE_TAG in .env}
    build:
      context: .
      target: worker
    <<: *logging
    restart: unless-stopped
    env_file: .env

volumes:
  caddy_data:
  caddy_config:
