# Production stack on the droplet (ADR-0007, amended): Caddy → app; worker
# alongside. Images are BUILT IN CI and pulled from GHCR — the $6 droplet
# doesn't build. Postgres is DO Managed (ADR-0003) — external DATABASE_URL.
# Deploy: git pull && docker compose -f docker-compose.prod.yml pull && \
#         docker compose -f docker-compose.prod.yml up -d
# (build: targets remain for local e2e:prod use — CI and local pass --build.)
# Log rotation (ADR-0010): stdout JSON captured by docker, bounded on disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    <<: *logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ghcr.io/loganbresnahan/monster-paws-app:latest
    build:
      context: .
      target: app
    <<: *logging
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  worker:
    image: ghcr.io/loganbresnahan/monster-paws-worker:latest
    build:
      context: .
      target: worker
    <<: *logging
    restart: unless-stopped
    env_file: .env

volumes:
  caddy_data:
  caddy_config:
