# Local dev database. pgvector image = same extension set as production
# (DO Managed Postgres supports pgvector — ADR-0003).
# The project name is pinned so containers and volumes never inherit the
# checkout directory's name.
name: monsterpaws
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: monsterpaws
      POSTGRES_PASSWORD: monsterpaws
      POSTGRES_DB: monsterpaws
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  # Every outreach message goes here in dev and in tests (ADR-0029 §4): SMTP
  # on 1025, the inbox and its REST API at http://localhost:8025. Nothing
  # leaves the machine unless the CLI is run with --live.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dbdata:
